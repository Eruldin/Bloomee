name: Android CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      # The ubuntu runner already ships an Android SDK in $ANDROID_HOME; only
      # make sure the platform/build-tools the project needs are installed.
      - name: Ensure Android SDK packages
        run: |
          SDKMANAGER="$(ls -d "$ANDROID_HOME"/cmdline-tools/*/bin/sdkmanager | sort -V | tail -1)"
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Lint
        run: ./gradlew lintDebug :wear:lintDebug

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build phone + watch debug APKs
        run: ./gradlew assembleDebug :wear:assembleDebug

      - name: Build desktop app classes
        run: ./gradlew :shared:build :desktop:compileKotlin

      - name: Build release AAB
        run: ./gradlew bundleRelease
